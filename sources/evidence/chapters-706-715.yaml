chapter_facts:
- {chapter: 706, facts: [玄灵玄雪接受玄元仙丹, 系统返还八十颗金仙道丹, 玄鸟族锁定天玄养伤小队]}
- {chapter: 707, facts: [周紫薇准备自爆, 系统识别SS级气运之女, 徐霄决定放走整支人族小队]}
- {chapter: 708, facts: [周紫薇接受玄元仙丹并将徐霄视为卧底, 返还三千大道丹和金仙道丹, 徐霄晋升太初仙体与天仙四重并领悟感知大道]}
- {chapter: 709, facts: [玄雪与徐霄公开对象关系, 玄鸟族补入天水城八大妖族, 天水城决定支援青木城]}
- {chapter: 710, facts: [天水城玄仙精锐抵达青木城, 确认一百零八阵眼任务]}
- {chapter: 711, facts: [凤天晴孔青主持青木城前线, 鹤仙儿被系统识别为SS级气运之女, 白鹤族开始布置阵眼]}
- {chapter: 712, facts: [青曼被识别为A级气运之女, 徐霄击杀追杀青曼的人族玄仙]}
- {chapter: 713, facts: [徐霄以三光神水治愈青曼, 青曼接受玄元仙丹并确立关系, 返还鸿蒙一气丹和金仙道丹]}
- {chapter: 714, facts: [赵四尊突破防线攻击阵眼, 人妖双方关注徐霄前线行为]}
- {chapter: 715, facts: [徐霄正面击退赵四尊, 天玄小队撤退, 阵眼保住, 缚仙绳赠送赤澜儿返还镇魂黑链]}
