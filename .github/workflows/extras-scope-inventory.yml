name: Extras Scope Inventory

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - 'data/audits/run-0128.yaml'
      - 'data/extras/run-0128-scope.yaml'
      - 'data/extras/run-0128-task-plan.yaml'
      - 'docs/08-analysis/extras-scope-inventory.md'
      - 'data/generated/**'
      - 'data/analysis/**'
      - 'docs/02-characters/**'
      - 'docs/06-artifacts/**'
      - 'docs/entity-docs-manifest.yaml'
      - 'data/audits/run-0125.yaml'
      - 'data/audits/run-0126.yaml'
      - 'data/audits/run-0127.yaml'
      - 'docs/08-analysis/entity-normalization.md'
      - 'docs/08-analysis/final-state-snapshot.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extras-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Generate deterministic extras inventory
        run: python scripts/inventory_extras.py --output-root build/extras

      - name: Check tracked outputs when present
        shell: bash
        run: |
          if [ -f data/audits/run-0128.yaml ]; then
            python scripts/inventory_extras.py \
              --output-root build/extras-check \
              --check-root .
          else
            echo 'RUN-0128 tracked outputs are not present yet; artifact materialization will be reviewed before merge.'
          fi

      - name: Upload extras inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: extras-scope-inventory-${{ github.sha }}
          path: |
            build/extras/data/audits/run-0128.yaml
            build/extras/data/extras/run-0128-scope.yaml
            build/extras/data/extras/run-0128-task-plan.yaml
            build/extras/docs/08-analysis/extras-scope-inventory.md
          if-no-files-found: error
          retention-days: 30

  materialize:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: extras-scope-main-materialization
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Materialize tracked extras inventory
        run: python scripts/inventory_extras.py --output-root .

      - name: Commit deterministic outputs when needed
        shell: bash
        run: |
          TRACKED_PATHS=(
            data/audits/run-0128.yaml
            data/extras/run-0128-scope.yaml
            data/extras/run-0128-task-plan.yaml
            docs/08-analysis/extras-scope-inventory.md
          )
          if [ -z "$(git status --porcelain -- "${TRACKED_PATHS[@]}")" ]; then
            echo 'Extras scope outputs are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TRACKED_PATHS[@]}"
          git commit -m 'chore(data): refresh extras scope inventory'
          git push origin HEAD:main
