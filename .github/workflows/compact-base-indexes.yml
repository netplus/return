name: Compact Base Indexes

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: canonical-index-maintenance
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install compaction dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run knowledge-base unit tests
        run: python scripts/test_knowledge_base.py

      - name: Validate before compaction
        run: python scripts/knowledge_base.py validate --generated-dir data/generated

      - name: Compact extensions into base indexes
        run: python scripts/knowledge_base.py compact

      - name: Validate compacted indexes
        run: |
          python scripts/knowledge_base.py validate
          python scripts/knowledge_base.py build --output-dir build/compacted-indexes
          python scripts/knowledge_base.py validate --generated-dir build/compacted-indexes
          git diff --check

      - name: Upload compacted base candidate
        uses: actions/upload-artifact@v4
        with:
          name: compacted-base-indexes-${{ github.sha }}
          path: |
            data/timeline/nodes.yaml
            data/characters/characters.yaml
            data/system/gifts.yaml
            data/artifacts/artifacts.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Create or refresh compaction pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          paths=(
            data/timeline/nodes.yaml
            data/characters/characters.yaml
            data/system/gifts.yaml
            data/artifacts/artifacts.yaml
          )
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then
            echo 'Base indexes are already compacted through the latest RUN.'
            exit 0
          fi

          watermark="$(python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('data/timeline/nodes.yaml').read_text(encoding='utf-8'))
          print(data.get('compacted_through_run', 'unknown'))
          PY
          )"
          branch='automation/base-index-compaction'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add "${paths[@]}"
          git commit -m "chore(data): compact base indexes through ${watermark}"
          git push --force origin "HEAD:refs/heads/${branch}"

          existing_pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title 'chore(data): compact canonical base indexes' \
              --body "Automated compaction candidate through **${watermark}**. The four historical base indexes are materialized from append-only extensions and stamped with a compaction watermark. Extension files remain immutable. Generated indexes are intentionally excluded; Knowledge Base CI rebuilds them after merge and includes any newer RUNs added while this PR is open."
          else
            echo "Updated existing compaction PR #${existing_pr} through ${watermark}."
          fi
