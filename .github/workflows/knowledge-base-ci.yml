name: Knowledge Base CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/generated/**'
      - 'docs/02-characters/**'
      - 'docs/06-artifacts/**'
      - 'docs/entity-docs-manifest.yaml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run knowledge-base unit tests
        run: python scripts/test_knowledge_base.py

      - name: Run entity-document renderer tests
        run: python scripts/test_render_entity_docs.py

      - name: Run character identity alignment tests
        run: python scripts/test_validate_entity_identity.py

      - name: Run character growth-line tests
        run: python scripts/test_render_character_growth.py

      - name: Validate base and extension indexes
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          python scripts/knowledge_base.py validate 2>&1 | tee build/validation.log

      - name: Validate append-only character growth continuity
        run: python scripts/render_character_growth.py --validate-continuity --effective-run 82

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.sha }}
          path: build/validation.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build materialized canonical indexes
        run: python scripts/knowledge_base.py build --output-dir build/canonical-indexes

      - name: Validate materialized indexes
        run: python scripts/knowledge_base.py validate --generated-dir build/canonical-indexes

      - name: Validate character identity alignment
        run: python scripts/validate_entity_identity.py --generated-dir build/canonical-indexes

      - name: Render complete entity-document projection with growth lines
        run: |
          python scripts/render_character_growth.py \
            --generated-dir build/canonical-indexes \
            --output-root build/entity-docs
          python scripts/render_character_growth.py \
            --generated-dir build/canonical-indexes \
            --output-root build/entity-docs \
            --check

      - name: Check whitespace errors
        run: git diff --check

      - name: Upload canonical index artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-indexes-${{ github.sha }}
          path: build/canonical-indexes/*.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Upload entity-document artifact
        uses: actions/upload-artifact@v4
        with:
          name: entity-documents-${{ github.sha }}
          path: |
            build/entity-docs/docs/02-characters
            build/entity-docs/docs/06-artifacts
            build/entity-docs/docs/entity-docs-manifest.yaml
          if-no-files-found: error
          retention-days: 14

  refresh-generated:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Rebuild tracked generated indexes and entity documents
        run: |
          python scripts/knowledge_base.py build --output-dir data/generated
          python scripts/knowledge_base.py validate --generated-dir data/generated
          python scripts/validate_entity_identity.py --generated-dir data/generated
          python scripts/render_character_growth.py --validate-continuity --effective-run 82
          python scripts/render_character_growth.py --generated-dir data/generated
          python scripts/render_character_growth.py --generated-dir data/generated --check

      - name: Commit and push refreshed generated views
        shell: bash
        run: |
          mkdir -p build
          if [ -z "$(git status --porcelain -- data/generated docs/02-characters docs/06-artifacts docs/entity-docs-manifest.yaml)" ]; then
            echo 'Generated indexes and entity documents are already current.' | tee build/push.log
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated docs/02-characters docs/06-artifacts docs/entity-docs-manifest.yaml
          git commit -m 'chore(data): refresh generated indexes and entity docs'

          set -o pipefail
          git push origin HEAD:main 2>&1 | tee build/push.log

      - name: Upload generated-view push report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-view-push-${{ github.sha }}
          path: build/push.log
          if-no-files-found: warn
          retention-days: 14
