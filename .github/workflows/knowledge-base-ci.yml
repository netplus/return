name: Knowledge Base CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/generated/**'
      - 'docs/02-characters/**'
      - 'docs/06-artifacts/**'
      - 'docs/entity-docs-manifest.yaml'
      - 'data/audits/run-0125.yaml'
      - 'docs/08-analysis/full-repository-audit.md'
      - 'docs/08-analysis/verification-debt.md'
      - 'docs/08-analysis/v1-baseline-statistics.md'
      - 'RELEASE_NOTES_v1.0.0.md'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run knowledge-base unit tests
        run: python scripts/test_knowledge_base.py

      - name: Run entity-document renderer tests
        run: python scripts/test_render_entity_docs.py

      - name: Run character identity alignment tests
        run: python scripts/test_validate_entity_identity.py

      - name: Run character growth-line tests
        run: python scripts/test_render_character_growth.py

      - name: Validate base and extension indexes
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          python scripts/knowledge_base.py validate 2>&1 | tee build/validation.log

      - name: Validate append-only character growth continuity
        run: python scripts/render_character_growth.py --validate-continuity --effective-run 82

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.sha }}
          path: build/validation.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build materialized canonical indexes
        run: python scripts/knowledge_base.py build --output-dir build/canonical-indexes

      - name: Validate materialized indexes
        run: python scripts/knowledge_base.py validate --generated-dir build/canonical-indexes

      - name: Validate character identity alignment
        run: python scripts/validate_entity_identity.py --generated-dir build/canonical-indexes

      - name: Render complete entity-document projection with growth lines
        run: |
          python scripts/render_character_growth.py \
            --generated-dir build/canonical-indexes \
            --output-root build/entity-docs
          python scripts/render_character_growth.py \
            --generated-dir build/canonical-indexes \
            --output-root build/entity-docs \
            --check

      - name: Run reproducible full-repository audit
        shell: bash
        run: |
          status=0
          python scripts/run_full_repository_audit.py \
            --run-id RUN-0125 \
            --task-id TASK-0111 \
            --version v1.0.0 \
            --audit-date 2026-07-29 \
            --source-commit "${GITHUB_SHA}" \
            --output-root build/audit || status=$?
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('build/audit/data/audits/run-0125.yaml')
          data = yaml.safe_load(path.read_text(encoding='utf-8'))
          print('Audit blocking findings:')
          print(yaml.safe_dump(data['audit']['blocking_findings'], allow_unicode=True, sort_keys=False))
          PY
          exit "$status"

      - name: Check whitespace errors
        run: git diff --check

      - name: Upload canonical index artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-indexes-${{ github.sha }}
          path: build/canonical-indexes/*.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Upload entity-document artifact
        uses: actions/upload-artifact@v4
        with:
          name: entity-documents-${{ github.sha }}
          path: |
            build/entity-docs/docs/02-characters
            build/entity-docs/docs/06-artifacts
            build/entity-docs/docs/entity-docs-manifest.yaml
          if-no-files-found: error
          retention-days: 14

      - name: Upload v1 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-audit-${{ github.sha }}
          path: |
            build/audit/docs/08-analysis
            build/audit/data/audits/run-0125.yaml
            build/audit/RELEASE_NOTES_v1.0.0.md
          if-no-files-found: error
          retention-days: 30

  refresh-generated:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Rebuild tracked generated views and freeze v1 audit once
        run: |
          python scripts/knowledge_base.py build --output-dir data/generated
          python scripts/knowledge_base.py validate --generated-dir data/generated
          python scripts/validate_entity_identity.py --generated-dir data/generated
          python scripts/render_character_growth.py --validate-continuity --effective-run 82
          python scripts/render_character_growth.py --generated-dir data/generated
          python scripts/render_character_growth.py --generated-dir data/generated --check
          if [ ! -f data/audits/run-0125.yaml ]; then
            python scripts/run_full_repository_audit.py \
              --run-id RUN-0125 \
              --task-id TASK-0111 \
              --version v1.0.0 \
              --audit-date 2026-07-29 \
              --source-commit "${GITHUB_SHA}" \
              --output-root .
          fi

      - name: Commit and push refreshed generated views
        shell: bash
        run: |
          mkdir -p build
          TRACKED_PATHS=(
            data/generated
            docs/02-characters
            docs/06-artifacts
            docs/entity-docs-manifest.yaml
            data/audits/run-0125.yaml
            docs/08-analysis/full-repository-audit.md
            docs/08-analysis/verification-debt.md
            docs/08-analysis/v1-baseline-statistics.md
            RELEASE_NOTES_v1.0.0.md
          )
          if [ -z "$(git status --porcelain -- "${TRACKED_PATHS[@]}")" ]; then
            echo 'Generated views and v1 audit baseline are already current.' | tee build/push.log
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TRACKED_PATHS[@]}"
          git commit -m 'chore(data): refresh generated views and freeze v1 audit'

          set -o pipefail
          git push origin HEAD:main 2>&1 | tee build/push.log

      - name: Upload generated-view push report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-view-push-${{ github.sha }}
          path: build/push.log
          if-no-files-found: warn
          retention-days: 14
