name: Knowledge Base CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/generated/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run knowledge-base unit tests
        run: python scripts/test_knowledge_base.py

      - name: Validate base and extension indexes
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          python scripts/knowledge_base.py validate 2>&1 | tee build/validation.log

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.sha }}
          path: build/validation.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build materialized canonical indexes
        run: python scripts/knowledge_base.py build --output-dir build/canonical-indexes

      - name: Validate materialized indexes
        run: python scripts/knowledge_base.py validate --generated-dir build/canonical-indexes

      - name: Check whitespace errors
        run: git diff --check

      - name: Upload canonical index artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-indexes-${{ github.sha }}
          path: build/canonical-indexes/*.yaml
          if-no-files-found: error
          retention-days: 14

  refresh-generated:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Rebuild tracked generated indexes
        run: |
          python scripts/knowledge_base.py build --output-dir data/generated
          python scripts/knowledge_base.py validate --generated-dir data/generated

      - name: Commit and push refreshed indexes
        shell: bash
        run: |
          mkdir -p build
          if [ -z "$(git status --porcelain -- data/generated)" ]; then
            echo 'Generated indexes are already current.' | tee build/push.log
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated
          git commit -m 'chore(data): refresh generated canonical indexes'

          set -o pipefail
          git push origin HEAD:main 2>&1 | tee build/push.log

      - name: Upload generated-index push report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-index-push-${{ github.sha }}
          path: build/push.log
          if-no-files-found: warn
          retention-days: 14
