name: Full Book Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/full-book-analysis.yml'
      - '.github/workflows/knowledge-base-ci.yml'
      - 'scripts/analyze_repository.py'
      - 'scripts/knowledge_base.py'
      - 'data/analysis/run-0127-config.yaml'
      - 'data/timeline/**'
      - 'data/characters/**'
      - 'data/system/**'
      - 'data/artifacts/**'
      - 'data/extensions/**'
      - '.project/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-book-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Build and validate canonical indexes
        run: |
          python scripts/knowledge_base.py build --output-dir build/canonical-indexes
          python scripts/knowledge_base.py validate --generated-dir build/canonical-indexes

      - name: Generate full-book analysis snapshot
        run: |
          python scripts/analyze_repository.py \
            --generated-dir build/canonical-indexes \
            --output-root build/analysis \
            --source-commit "${GITHUB_SHA}" \
            --analysis-date 2026-07-29

      - name: Smoke-test SQLite dataset
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          root = Path('build/analysis')
          summary = json.loads((root / 'data/analysis/run-0127/summary.json').read_text(encoding='utf-8'))
          db = sqlite3.connect(root / 'data/analysis/run-0127/full-book.sqlite3')
          try:
              assert db.execute('select count(*) from timeline_nodes').fetchone()[0] == 108
              assert db.execute("select count(*) from characters where record_status != 'superseded'").fetchone()[0] == 233
              assert db.execute('select count(*) from gifts').fetchone()[0] == 259
              assert db.execute('select count(*) from artifacts').fetchone()[0] == 149
              assert db.execute('pragma integrity_check').fetchone()[0] == 'ok'
          finally:
              db.close()
          assert summary['quality']['blocking_findings'] == []
          print(json.dumps(summary['coverage'], ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload full-book analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-book-analysis-${{ github.sha }}
          path: |
            build/analysis/data/audits/run-0127.yaml
            build/analysis/data/analysis/run-0127
            build/analysis/docs/08-analysis/full-book-analysis.md
            build/analysis/docs/08-analysis/relationship-graph.mmd
            build/analysis/docs/08-analysis/relationship-graph.dot
          if-no-files-found: error
          retention-days: 30
